$kind: http-request
description: Requête automatisée de test API REST.
url: "{{baseUrl}}/complaints/{{complaintId}}"
method: DELETE
headers:
  Accept: application/json
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200 - réclamation supprimée", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Message de confirmation", function () {
          pm.expect(pm.response.json().message).to.include("deleted");
      });
    language: text/javascript
order: 10000
