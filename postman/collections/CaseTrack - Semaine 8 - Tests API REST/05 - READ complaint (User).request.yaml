$kind: http-request
description: Requête automatisée de test API REST.
url: "{{baseUrl}}/complaints/{{complaintId}}"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{userToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200 - réclamation récupérée", function () {
          pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      pm.test("Identifiant conforme", function () {
          pm.expect(String(data.complaint.id || data.complaint._id)).to.eql(pm.collectionVariables.get("complaintId"));
      });
      pm.test("Réponse JSON", function () {
          pm.response.to.be.json;
      });
    language: text/javascript
order: 5000
